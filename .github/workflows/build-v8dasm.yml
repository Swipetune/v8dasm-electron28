name: Build v8dasm for V8 12.8.374

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.fast'
      - 'Disassembler/**'

env:
  V8_VERSION: "12.8.374"
  REGISTRY: ghcr.io
  BASE_IMAGE: ghcr.io/swipetune/v8dasm-electron28-v8-base

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3 hours max (fallback), fast build takes ~20 min
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Try to use fast build with pre-built base image
      - name: Check if base image exists
        id: check_base
        run: |
          if docker manifest inspect ${{ env.BASE_IMAGE }}:${{ env.V8_VERSION }} > /dev/null 2>&1; then
            echo "base_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Base image found - using FAST build (~20 min)"
          else
            echo "base_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Base image not found - using FULL build (~2.5 hours)"
            echo "   Run 'Build V8 Base Image' workflow first for faster builds!"
          fi

      # FAST PATH: Use pre-built base image
      - name: Build v8dasm (FAST - using base image)
        if: steps.check_base.outputs.base_exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.fast
          push: false
          load: true
          tags: v8dasm:${{ env.V8_VERSION }}
          build-args: |
            V8_BASE_IMAGE=${{ env.BASE_IMAGE }}:${{ env.V8_VERSION }}

      # SLOW PATH: Full build from scratch
      - name: Build v8dasm (FULL - no base image)
        if: steps.check_base.outputs.base_exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: v8dasm:${{ env.V8_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract v8dasm binary
        run: |
          docker create --name temp-v8dasm v8dasm:${{ env.V8_VERSION }}
          docker cp temp-v8dasm:/usr/local/bin/v8dasm ./v8dasm-linux-x64
          docker rm temp-v8dasm
          chmod +x ./v8dasm-linux-x64
          file ./v8dasm-linux-x64

      - name: Upload v8dasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8dasm-v8-${{ env.V8_VERSION }}-linux-x64
          path: ./v8dasm-linux-x64
          retention-days: 90

      - name: Test v8dasm
        run: |
          ./v8dasm-linux-x64 --help || echo "v8dasm ready (no --help flag)"
