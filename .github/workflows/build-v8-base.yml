name: Build V8 Base Image
# Build and push V8 12.8.374 base image (RUN ONCE MANUALLY)
# This avoids 2.5 hour rebuilds for every code change

on:
  workflow_dispatch:  # Manual trigger only

env:
  V8_VERSION: "12.8.374"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-v8-base

jobs:
  build-base:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push V8 base image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.V8_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
